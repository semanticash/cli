name: CI (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build (compilation gate)
        run: go build ./...

      # Preserve test failures while allowing one known Windows cleanup error.
      - name: Fast tests (runtime correctness)
        shell: bash
        run: |
          set +e
          go test -short ./... -count=1 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          set -e
          bash .github/scripts/check-go-test-status.sh "$status" test-output.txt

      - name: Integration tests (locking, detachment, concurrency)
        shell: bash
        run: |
          set +e
          go test -run "Integration|CrossProcess|Stress|E2E" ./... -count=1 -timeout 5m 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          set -e
          bash .github/scripts/check-go-test-status.sh "$status" test-output.txt
