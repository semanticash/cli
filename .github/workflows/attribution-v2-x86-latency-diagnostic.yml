# Profiles slow post-hook calls on x86 and uploads per-call stage data.
# Stage recording adds overhead, so this workflow does not enforce latency limits.
name: Attribution v2 x86 latency diagnostic

on:
  push:
    branches:
      - release/0.7.0-attribution-v2
    paths:
      - .github/workflows/attribution-v2-x86-latency-diagnostic.yml
      - e2e/toolwindow_bench_test.go
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out v0.6.2
        uses: actions/checkout@v5
        with:
          ref: v0.6.2
          fetch-depth: 0

      - name: Verify architecture, revision, and runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          test "$(git rev-parse HEAD)" = "7a6444ece608f29ab7f26254a126316c097a2c79"
          uname -a
          lscpu
          git --version

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: make build

      - name: Overlay diagnostic bench harness from the triggering commit
        shell: bash
        run: |
          set -euo pipefail
          # Keep the measured product code at v0.6.2 and overlay only the
          # diagnostic harness from the triggering commit.
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git show "${GITHUB_SHA}:e2e/toolwindow_bench_test.go" > e2e/toolwindow_bench_test.go
          grep -q SEMANTICA_BENCH_DIAG e2e/toolwindow_bench_test.go

      - name: Diagnose 500-file matrix with stage timing
        shell: bash
        env:
          SEMANTICA_BENCH_FILES: "500"
          SEMANTICA_BENCH_DIRTY: "500"
          SEMANTICA_BENCH_DIAG: "1"
          SEMANTICA_BENCH_DIAG_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          go test -tags e2e -bench ToolWindow -benchtime 100x \
            -count 3 -run xxx -v ./e2e | tee bench-500-diag.txt
          echo "=== slowest post-hook stage lines ==="
          grep "STAGE-DIAG" bench-500-diag.txt

      - name: Verify diagnostic completeness and validity
        shell: bash
        run: |
          set -euo pipefail
          # Require one matched diagnostic for each of the nine recorded runs.
          matched=$(grep -c 'STAGE-DIAG-MATCHED' bench-500-diag.txt || true)
          unmatched=$(grep -c 'STAGE-DIAG-UNMATCHED' bench-500-diag.txt || true)
          echo "matched=${matched} (want 9) unmatched=${unmatched} (want 0)"
          test "${matched}" -eq 9
          test "${unmatched}" -eq 0
          # Reject incomplete series and mismatched pre/post tool-use IDs.
          python3 - <<'PY'
          import glob, json, sys
          files = sorted(glob.glob("*.bench.jsonl"))
          if len(files) != 9:
              sys.exit(f"expected 9 jsonl files, found {len(files)}")
          for path in files:
              pre, post = [], []
              with open(path) as fh:
                  for line in fh:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          r = json.loads(line)
                      except json.JSONDecodeError:
                          sys.exit(f"{path}: unparseable line")
                      if r.get("phase") == "pre":
                          pre.append(r.get("tool_use_id"))
                      elif r.get("phase") == "post":
                          post.append(r.get("tool_use_id"))
              errs = []
              if len(pre) != 100:
                  errs.append(f"{len(pre)} pre (want 100)")
              if len(post) != 100:
                  errs.append(f"{len(post)} post (want 100)")
              if len(set(pre)) != len(pre):
                  errs.append("duplicate pre tool_use_ids")
              if len(set(post)) != len(post):
                  errs.append("duplicate post tool_use_ids")
              if any(not x for x in pre + post):
                  errs.append("empty tool_use_id")
              if set(pre) != set(post):
                  errs.append("pre/post tool_use_id sets differ (unpaired cycle)")
              if errs:
                  sys.exit(f"{path}: " + "; ".join(errs))
          print(f"all {len(files)} series valid: 100 pre + 100 post, unique tool_use_ids")
          PY

      - name: Upload diagnostic output and per-call stage series
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attribution-v2-x86-latency-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bench-500-diag.txt
            *.bench.jsonl
          if-no-files-found: error
          retention-days: 30
